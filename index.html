<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prática Tailwind - Dia 2 [Atividade 1]</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <article class="w-full max-w-[400px] bg-white rounded-xl shadow-lg overflow-hidden">

    <img
      src="https://i.pinimg.com/1200x/15/ca/57/15ca57e69eb155e3dfafa957b3c04095.jpg"
      alt="Troféu representando uma premiação"
      class="w-full h-[180px] object-cover rounded-full"
    />

    <div class="p-6">

      <h1 class="text-2xl font-bold text-green-900 mb-3">
        Prêmio IEL 2026
      </h1>

      <p class="text-gray-600 text-base leading-relaxed mb-5">
        IFRN conquista reconhecimento no Prêmio IEL 2026,
        destacando iniciativas de excelência, inovação e
        desenvolvimento institucional.
      </p>

      <div class="flex flex-wrap gap-2">
        <span class="bg-green-100 text-green-800 text-sm font-semibold px-3 py-1 rounded-full">
          🏆 1º Lugar
        </span>

        <span class="bg-green-100 text-green-800 text-sm font-semibold px-3 py-1 rounded-full">
          🥇 Ouro
        </span>

        <span class="bg-green-100 text-green-800 text-sm font-semibold px-3 py-1 rounded-full">
          ⭐ Destaque Institucional
        </span>
      </div>

    </div>
  </article>

</body>
</html>
