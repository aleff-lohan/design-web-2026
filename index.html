<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 1 – Tailwind</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/phosphor-icons@latest/src/css/phosphor.css" />
</head>

<body class="min-h-screen bg-gray-100">

    <header class="bg-green-800 text-white">

        <div class="mx-auto max-w-7xl px-4">

            <div class="flex items-center justify-between gap-4 py-6">

                <div class="flex items-center gap-3">

                    <div class="hidden text-4xl md:block">
                        <i class="ph ph-squares-four"></i>
                    </div>

                    <div>
                        <h1 class="text-xl font-bold leading-tight md:text-lg">
                            <a
                                href="/"
                                title="Instituto Federal de Educação, Ciência e Tecnologia do Estado do Rio Grande do Norte"
                                class="text-white no-underline"
                            >
                                INSTITUTO FEDERAL
                            </a>
                        </h1>

                        <p class="text-xs text-white">
                            Rio Grande do Norte
                        </p>
                    </div>

                    <p class="ml-8 hidden max-w-xs text-xs font-semibold leading-tight md:block">
                        Educação, Ciência, Cultura e Tecnologia
                        <br>
                        em todo o Rio Grande do Norte
                    </p>

                </div>

                <div class="flex items-center gap-2">

                    <div class="hidden items-center gap-2 md:flex">

                        <a
                            href="#"
                            aria-label="Instagram"
                            class="flex h-11 w-11 items-center justify-center rounded-full border border-white text-xl transition hover:bg-white hover:text-green-800"
                        > <img src="assets/img/instagram-logo.svg" alt="">
                            <i class="ph ph-instagram-logo"></i>
                        </a>

                        <a
                            href="#"
                            aria-label="Twitter"
                            class="flex h-11 w-11 items-center justify-center rounded-full border border-white text-xl transition hover:bg-white hover:text-green-800"
                        > <img src="assets/img/x-logo.svg" alt="">
                            <i class="ph ph-twitter-logo"></i>
                        </a>

                        <a
                            href="#"
                            aria-label="LinkedIn"
                            class="flex h-11 w-11 items-center justify-center rounded-full border border-white text-xl transition hover:bg-white hover:text-green-800"
                        > <img src="assets/img/linkedin-logo.svg" alt="">
                            <i class="ph ph-linkedin-logo"></i>
                        </a>

                        <a
                            href="#"
                            aria-label="YouTube"
                            class="flex h-11 w-11 items-center justify-center rounded-full border border-white text-xl transition hover:bg-white hover:text-green-800"
                        > <img src="assets/img/youtube-logo.svg" alt="">
                            <i class="ph ph-youtube-logo"></i>
                        </a>

                        <a
                            href="#"
                            aria-label="Spotify"
                            class="flex h-11 w-11 items-center justify-center rounded-full border border-white text-xl transition hover:bg-white hover:text-green-800"
                        > <img src="assets/img/spotify-logo.svg" alt="">
                            <i class="ph ph-spotify-logo"></i>
                        </a>

                        <a
                            href="#"
                            aria-label="TikTok"
                            class="flex h-11 w-11 items-center justify-center rounded-full border border-white text-xl transition hover:bg-white hover:text-green-800"
                        > <img src="assets/img/tiktok-logo.svg" alt="">
                            <i class="ph ph-tiktok-logo"></i>
                        </a>

                    </div>

                    <div class="mx-2 hidden h-8 border-l border-white/50 md:block"></div>

                    <button
                        id="altocontraste"
                        type="button"
                        aria-label="Alto contraste"
                        class="hidden h-11 w-11 items-center justify-center rounded-full border border-white text-xl md:flex"
                    > <img src="assets/img/moon.svg" alt="">
                        <i class="ph ph-contrast"></i>
                    </button>

                    <button
                        type="button"
                        aria-label="Modo escuro"
                        class="hidden h-11 w-11 items-center justify-center rounded-full border border-white text-xl md:flex"
                    > <img src="assets/img/yin-yang.svg" alt="">
                        <i class="ph ph-moon"></i>
                    </button>

                    <form
                        method="get"
                        action="/search/"
                        class="hidden h-11 items-center rounded-full bg-white px-4 md:flex"
                    >
                        <input
                            type="search"
                            name="query"
                            placeholder="Busca"
                            aria-label="Busca"
                            class="w-36 bg-transparent text-sm text-gray-700 placeholder-gray-500 focus:outline-none"
                        />

                        <button
                            type="submit"
                            aria-label="Pesquisar"
                            class="text-lg text-gray-500"
                        >
                            <i class="ph ph-magnifying-glass"></i>
                        </button>
                    </form>

                    <button
                        id="menuToggle"
                        type="button"
                        aria-label="Menu"
                        class="rounded p-2 text-3xl md:hidden"
                    >
                        <i class="ph ph-list"></i>
                    </button>

                </div>

            </div>

            <div class="border-t border-white/60"></div>

            <nav
                aria-label="Navegação principal"
                class="hidden items-center gap-7 py-4 md:flex"
            >
                <a
                    href="#"
                    class="text-sm font-bold no-underline transition hover:text-green-200"
                >
                    Processos seletivos
                </a>

                <a
                    href="#"
                    class="text-sm font-bold no-underline transition hover:text-green-200"
                >
                    Cursos
                </a>

                <a
                    href="#"
                    class="text-sm font-bold no-underline transition hover:text-green-200"
                >
                    Campi
                </a>

                <a
                    href="#"
                    class="text-sm font-bold no-underline transition hover:text-green-200"
                >
                    Institucional
                </a>

                <a
                    href="#"
                    class="text-sm font-bold no-underline transition hover:text-green-200"
                >
                    Acesso à Informação
                </a>

                <a
                    href="#"
                    class="text-sm font-bold no-underline transition hover:text-green-200"
                >
                    Eventos
                </a>

                <a
                    href="#"
                    class="text-sm font-bold no-underline transition hover:text-green-200"
                >
                    Serviços
                </a>
            </nav>

        </div>

    </header>

</body>

</html>
